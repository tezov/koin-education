[versions]
agp = "9.1.0"
android-minSdk = "24"
android-compileSdk = "36"
android-targetSdk = "36"

kotlin = "2.3.20"

koinCompiler = "0.6.2"
koinCompose = "4.2.1-RC1"
koinComposeAnnotation = "4.2.1-RC1"
koinComposeViewmodel = "4.2.1-RC1"

compose-multiplatform = "1.10.3"
compose-material3 = "1.9.0"
compose-material-icons = "1.7.3"
compose-navigation3-ui = "1.1.0-beta01"
compose-navigation3-adaptive = "1.3.0-alpha06"
compose-navigation3-lifecycle = "2.10.0"
serialization = "1.10.0"

test-kotlin-coroutine = "1.10.2"

# Android
compose-android-activity = "1.13.0"
compose-android = "1.10.6"

[libraries]
compose-runtime = { group = "org.jetbrains.compose.runtime", name = "runtime", version.ref = "compose-multiplatform" }
compose-foundation = { group = "org.jetbrains.compose.foundation", name = "foundation", version.ref = "compose-multiplatform" }
compose-ui = { group = "org.jetbrains.compose.ui", name = "ui", version.ref = "compose-multiplatform" }
compose-material3 = { group = "org.jetbrains.compose.material3", name = "material3", version.ref = "compose-material3" }
compose-material-icons-core = { module = "org.jetbrains.compose.material:material-icons-core", version.ref = "compose-material-icons" }
compose-navigation3-ui = { module = "org.jetbrains.androidx.navigation3:navigation3-ui", version.ref = "compose-navigation3-ui" }
compose-navigation3-adaptive = { module = "org.jetbrains.compose.material3.adaptive:adaptive-navigation3", version.ref = "compose-navigation3-adaptive" }
compose-navigation3-lifecycle = { module = "org.jetbrains.androidx.lifecycle:lifecycle-viewmodel-navigation3", version.ref = "compose-navigation3-lifecycle" }

koin-compose = { module = "io.insert-koin:koin-compose", version.ref = "koinCompose" }
koin-compose-annotation = { module = "io.insert-koin:koin-annotations", version.ref = "koinComposeAnnotation" }
koin-compose-viewmodel = { module = "io.insert-koin:koin-compose-viewmodel", version.ref = "koinComposeViewmodel" }

kotlinx-serialization-core = { module = "org.jetbrains.kotlinx:kotlinx-serialization-core", version.ref = "serialization" }

# Android
compose-activity = { group = "androidx.activity", name = "activity-compose", version.ref = "compose-android-activity" }
compose-foundation-android = { group = "androidx.compose.foundation", name = "foundation", version.ref = "compose-android" }
compose-ui-android = { group = "androidx.compose.ui", name = "ui", version.ref = "compose-android" }

# Test
kotlin-test = { module = "org.jetbrains.kotlin:kotlin-test", version.ref = "kotlin" }
kotlin-test-coroutine = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-test", version.ref = "test-kotlin-coroutine" }

[plugins]
androidApplication = { id = "com.android.application", version.ref = "agp" }
kotlinMultiplatform = { id = "org.jetbrains.kotlin.multiplatform", version.ref = "kotlin" }
androidKotlinMultiplatformLibrary = { id = "com.android.kotlin.multiplatform.library", version.ref = "agp" }
composeCompiler = { id = "org.jetbrains.kotlin.plugin.compose", version.ref = "kotlin" }
composeMultiplatform = { id = "org.jetbrains.compose", version.ref = "compose-multiplatform" }
kotlinSerialization = { id = "org.jetbrains.kotlin.plugin.serialization", version.ref = "kotlin" }
koinCompiler = { id = "io.insert-koin.compiler.plugin", version.ref = "koinCompiler" }
